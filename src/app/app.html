<div style="padding: 15px; font-family: sans-serif;">
  <h3>Excel Database Manager</h3>

  <div style="margin-bottom: 10px;">
    <label>Entity/Table Name:</label><br />
    <input type="text" [(ngModel)]="entityName" placeholder="e.g. product" />
  </div>

  <div style="margin-bottom: 10px;">
    <label>WHERE Clause (Optional):</label><br />
    <input type="text" [(ngModel)]="whereClause" placeholder="e.g. status = 'ACTIVE'" />
  </div>

  <div style="margin-bottom: 10px;">
    <label>Custom Function/Transformer Bean (Optional):</label><br />
    <input type="text" [(ngModel)]="transformerBean" placeholder="Leave blank if none (e.g. productTransformer)" />
  </div>

  <div style="margin-top: 15px;">
    <button (click)="onDownload()" [disabled]="loading()">Download to Excel</button>
    <button (click)="onUpload()" [disabled]="loading()" style="margin-left: 10px;">Upload Changes</button>
  </div>

  <div style="margin-top: 15px; font-weight: bold; color: #333;">
    <p>Status: {{ statusMessage() }}</p>
  </div>
</div>
